[package]
name = "aur_security_web"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aur_security_protocol = { path = "../protocol" }
chrono.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
tracing.workspace = true

[build-dependencies]
topcoat = { version = "0.5", default-features = false, features = ["tailwind"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aur_security_db = { path = "../db", features = ["sqlite"] }
clap.workspace = true
sqlx.workspace = true
tokio.workspace = true
topcoat = { workspace = true, features = ["asset", "discover", "router", "runtime", "serve", "tailwind"] }
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
aur_security_db = { path = "../db", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
http.workspace = true
topcoat = { workspace = true, default-features = false, features = ["asset", "discover", "router", "runtime"] }
worker = { version = "0.8", features = ["d1", "http"] }
worker-macros = { version = "0.8", features = ["http"] }
wasm-bindgen.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
