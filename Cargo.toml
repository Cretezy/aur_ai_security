[workspace]
members = ["checker", "cli", "db", "web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Cretezy/aur_ai_security"

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
git2 = "0.20"
humantime = "2"
reqwest = "0.12"
rig-core = "0.40"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
topcoat = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
